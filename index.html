                <div>
                  <div style={{ fontSize:12, fontWeight:500, color:"#3d3d3a", marginBottom:8 }}>Canvas Background</div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:6, alignItems:"center" }}>
                    {CANVAS_BG_PRESETS.map(({ hex, label }) => (
                      <button key={hex} onClick={() => setCanvasBg(hex)} title={label}
                        style={{ width:24, height:24, borderRadius:6, border:`2px solid ${canvasBg===hex ? "#4f46e5" : "rgba(0,0,0,0.12)"}`, cursor:"pointer", background:hex, transition:"all 120ms", transform: canvasBg===hex ? "scale(1.15)" : "scale(1)" }} />
                    ))}
                    <input type="color" value={canvasBg} onChange={e => setCanvasBg(e.target.value)} title="Custom"
                      style={{ width:24, height:24, borderRadius:6, border:"1px solid #e5e5e3", cursor:"pointer", padding:2 }} />
                  </div>
                </div>
              </div>

              {generating && (
                <div style={{ marginTop:12, display:"flex", alignItems:"center", gap:6, fontSize:12, color:"#6366f1" }}>
                  <div className="animate-spin" style={{ width:12, height:12, border:"2px solid #c7d2fe", borderTopColor:"#4f46e5", borderRadius:"50%" }} />
                  Updating pattern…
                </div>
              )}
            </div>

            {/* SAVE */}
            {pattern && (
              <div className="panel" style={{ padding:"16px", marginTop:8 }}>
                <div className="section-label">Save</div>
                <input type="text" placeholder="Pattern name…" value={saveName}
                  onChange={e => setSaveName(e.target.value)} onKeyDown={e => e.key==="Enter" && saveToLibrary()}
                  style={{ width:"100%", border:"1px solid #e5e5e3", borderRadius:7, padding:"7px 10px", fontSize:13, outline:"none", color:"#1a1a18" }}
                  onFocus={e => e.target.style.borderColor="#4f46e5"}
                  onBlur={e => e.target.style.borderColor="#e5e5e3"} />
                <button onClick={saveToLibrary} disabled={!saveName.trim()} className="btn btn-secondary"
                  style={{ width:"100%", marginTop:8, justifyContent:"center" }}>
                  <Icon name="save" size={13} />
                  Save to Library
                </button>
              </div>
            )}
          </div>

          {/* ── Main Area ── */}
          <div style={{ flex:1, minWidth:0, display:"flex", flexDirection:"column", gap:12 }}>

            {!pattern && !generating && (
              <div className="panel" style={{ height:400, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:12 }}>
                <div style={{ width:48, height:48, borderRadius:12, background:"#f4f4f3", display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <Icon name="layers" size={22} strokeWidth={1.5} className="text-neutral-400" />
                </div>
                <div style={{ fontSize:16, fontWeight:600, color:"#1a1a18" }}>No pattern yet</div>
                <div style={{ fontSize:13, color:"#a0a09d", maxWidth:280, textAlign:"center", lineHeight:1.5 }}>
                  Upload a photo and adjust the settings — the pattern updates live as you move the sliders.
                </div>
              </div>
            )}

            {generating && !pattern && (
              <div className="panel" style={{ height:400, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:12 }}>
                <div className="animate-spin" style={{ width:32, height:32, border:"3px solid #e0e7ff", borderTopColor:"#4f46e5", borderRadius:"50%" }} />
                <div style={{ fontSize:13, color:"#6b6b68" }}>Generating pattern…</div>
              </div>
            )}

            {pattern && (
              <>
                {/* ── Toolbar ── */}
                <div className="panel" style={{ padding:"8px 12px", display:"flex", alignItems:"center", gap:4 }}>
                  {/* Pattern info */}
                  <div style={{ display:"flex", alignItems:"center", gap:8, paddingRight:8 }}>
                    {generating && <div className="animate-spin" style={{ width:12, height:12, border:"2px solid #c7d2fe", borderTopColor:"#4f46e5", borderRadius:"50%", flexShrink:0 }} />}
                    <span style={{ fontSize:12, color:"#a0a09d" }}>
                      <strong style={{ color:"#1a1a18", fontWeight:600 }}>{pattern.width}×{pattern.height}</strong>
                      {" · "}
                      <strong style={{ color:"#1a1a18", fontWeight:600 }}>{pattern.palette.length}</strong> colors
                    </span>
                  </div>

                  <div style={{ width:1, height:20, background:"#e5e5e3", margin:"0 4px" }} />

                  {/* Undo/Redo */}
                  <button onClick={undo} disabled={!canUndo} title="Undo (Ctrl+Z)" className="btn btn-ghost btn-icon">
                    <Icon name="rotateCcw" size={14} />
                  </button>
                  <button onClick={redo} disabled={!canRedo} title="Redo (Ctrl+Y)" className="btn btn-ghost btn-icon">
                    <Icon name="rotateCw" size={14} />
                  </button>

                  <div style={{ width:1, height:20, background:"#e5e5e3", margin:"0 4px" }} />

                  {/* Zoom */}
                  <button onClick={() => setPatternZoom(z => Math.max(0.5, +(z - 0.25).toFixed(2)))} className="btn btn-ghost btn-icon btn-sm">
                    <Icon name="minus" size={13} />
                  </button>
                  <span style={{ fontSize:11, color:"#a0a09d", minWidth:32, textAlign:"center", userSelect:"none" }}>{Math.round(patternZoom*100)}%</span>
                  <button onClick={() => setPatternZoom(z => Math.min(4, +(z + 0.25).toFixed(2)))} className="btn btn-ghost btn-icon btn-sm">
                    <Icon name="plus" size={13} />
                  </button>

                  <div style={{ flex:1 }} />

                  {/* Mode buttons */}
                  <button onClick={toggleStitchSelect} className={`btn btn-secondary btn-sm ${stitchSelectMode ? "active" : ""}`}>
                    <Icon name="pointer" size={13} />
                    Select
                  </button>

                  {cropMode ? (
                    <>
                      <button onClick={applyCrop} className="btn btn-primary btn-sm">
                        <Icon name="check" size={13} />
                        Confirm Crop
                      </button>
                      <button onClick={toggleCropMode} className="btn btn-secondary btn-sm">
                        <Icon name="x" size={13} />
                        Cancel
                      </button>
                    </>
                  ) : (
                    <button onClick={toggleCropMode} className={`btn btn-secondary btn-sm ${cropMode ? "active" : ""}`}>
                      <Icon name="crop" size={13} />
                      Crop
                    </button>
                  )}

                  {showAddRow ? (
                    <>
                      <button onClick={() => addRow('top')} className="btn btn-primary btn-sm">
                        <Icon name="arrowUp" size={13} />
                        Top
                      </button>
                      <button onClick={() => addRow('bottom')} className="btn btn-primary btn-sm">
                        <Icon name="arrowDown" size={13} />
                        Bottom
                      </button>
                      <button onClick={() => setShowAddRow(false)} className="btn btn-secondary btn-sm">
                        <Icon name="x" size={13} />
                        Cancel
                      </button>
                    </>
                  ) : (
                    <button onClick={() => setShowAddRow(true)} className="btn btn-secondary btn-sm">
                      <Icon name="plus" size={13} />
                      Add Row
                    </button>
                  )}

                  <button onClick={() => setZoomOut(z => !z)} className={`btn btn-secondary btn-sm ${zoomOut ? "active" : ""}`}>
                    <Icon name="eye" size={13} />
                    {zoomOut ? "Edit" : "Preview"}
                  </button>

                  <button onClick={aiEnhance} className="btn btn-secondary btn-sm">
                    <Icon name="wand2" size={13} />
                    Enhance
                  </button>

                  <div style={{ width:1, height:20, background:"#e5e5e3", margin:"0 4px" }} />

                  {/* Export */}
                  <div style={{ position:"relative" }} ref={exportMenuRef}>
                    <button onClick={() => setExportMenuOpen(o => !o)} className="btn btn-primary btn-sm">
                      <Icon name="download" size={13} />
                      Export
                      <Icon name="chevronDown" size={11} />
                    </button>
                    {exportMenuOpen && (
                      <div style={{ position:"absolute", right:0, top:"calc(100% + 4px)", zIndex:30, background:"white", border:"1px solid #e5e5e3", borderRadius:10, boxShadow:"0 8px 24px rgba(0,0,0,0.1)", padding:"4px", minWidth:140 }}>
                        {[
                          { label:"PNG image", action: exportPNG },
                          { label:"PDF / Print", action: exportPDF },
                          { label:"CSV chart", action: exportCSV },
                        ].map(({ label, action }) => (
                          <button key={label} onClick={() => { action(); setExportMenuOpen(false); }}
                            style={{ display:"block", width:"100%", textAlign:"left", padding:"7px 10px", fontSize:12, color:"#3d3d3a", background:"transparent", border:"none", borderRadius:7, cursor:"pointer", transition:"background 100ms" }}
                            onMouseEnter={e => e.currentTarget.style.background="#f4f4f3"}
                            onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                            {label}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                {/* ── Canvas Area ── */}
                <div className="panel" style={{ padding:0, overflow:"hidden" }}>
                  {zoomOut ? (
                    <div style={{ padding:"20px" }}>
                      <ZoomPreview grid={pattern.grid} width={pattern.width} height={pattern.height} palette={pattern.palette} canvasBg={canvasBg} />
                    </div>
                  ) : (
                    <>
                      {/* Context strip */}
                      <div style={{ padding:"8px 14px", borderBottom:"1px solid #f0f0ee", display:"flex", alignItems:"center", gap:8, minHeight:38, flexWrap:"wrap" }}>
                        {cropMode ? (
                          <>
                            <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:12, fontWeight:600, color:"#059669" }}>
                              <Icon name="crop" size={13} />
                              Crop mode
                            </div>
                            <span style={{ color:"#e5e5e3" }}>|</span>
                            <span style={{ fontSize:11, color:"#a0a09d" }}>Drag edge or corner handles to resize · outward to expand</span>
                            {cropBounds && <span style={{ fontSize:12, fontWeight:700, color:"#059669", marginLeft:2 }}>{cropBounds.x2 - cropBounds.x1 + 1} × {cropBounds.y2 - cropBounds.y1 + 1}</span>}
                          </>
                        ) : stitchSelectMode ? (
                          <>
                            <div style={{ display:"flex", alignItems:"center", gap:5, fontSize:12, fontWeight:600, color:"#4f46e5" }}>
                              <Icon name="pointer" size={13} />
                              Select mode
                            </div>
                            <span style={{ color:"#e5e5e3" }}>|</span>
                            <span style={{ fontSize:11, color:"#a0a09d" }}>Click or drag to select stitches</span>
                            {selectedCells.size > 0 && (
                              <>
                                <span style={{ color:"#e5e5e3" }}>|</span>
                                <span style={{ fontSize:12, fontWeight:600, color:"#1a1a18" }}>{selectedCells.size} selected</span>
                                <button onClick={deleteSelectedCells} className="btn btn-danger-ghost btn-sm">
                                  <Icon name="trash2" size={11} />
                                  Delete
                                </button>
                                <span style={{ fontSize:11, color:"#a0a09d" }}>Fill:</span>
                                {pattern.palette.map(c => (
                                  <button key={c.id} onClick={() => replaceSelectedCells(c.id)}
                                    style={{ width:18, height:18, borderRadius:"50%", border:"2px solid white", boxShadow:"0 0 0 1px rgba(0,0,0,0.12)", cursor:"pointer", background:c.hex, flexShrink:0, transition:"transform 120ms" }}
                                    onMouseEnter={e => e.currentTarget.style.transform="scale(1.25)"}
                                    onMouseLeave={e => e.currentTarget.style.transform="scale(1)"}
                                    title={`DMC ${findClosestDMC(c.hex).number}`} />
                                ))}
                                <label title="Fill with a new color (snaps to nearest DMC)"
                                  style={{ width:18, height:18, borderRadius:"50%", border:"2px dashed #a0a09d", cursor:"pointer", flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", transition:"transform 120ms", position:"relative" }}
                                  onMouseEnter={e => e.currentTarget.style.transform="scale(1.25)"}
                                  onMouseLeave={e => e.currentTarget.style.transform="scale(1)"}>
                                  <input type="color" onChange={e => fillSelectedWithNewColor(e.target.value)}
                                    style={{ opacity:0, position:"absolute", width:0, height:0, pointerEvents:"none" }} />
                                  <Icon name="plus" size={10} />
                                </label>
                                <button onClick={() => setSelectedCells(new Set())} className="btn btn-ghost btn-sm">
                                  <Icon name="x" size={11} />
                                  Clear
                                </button>
                              </>
                            )}
                          </>
                        ) : (
                          <>
                            <span style={{ fontSize:11, color:"#a0a09d" }}>Paint:</span>
                            {pattern.palette.slice().sort((a,b) => (colorCounts[b.id]||0)-(colorCounts[a.id]||0)).map(c => (
                              <button key={c.id} onClick={() => selectColorHandler(c.id)}
                                style={{ width:20, height:20, borderRadius:"50%", border:`2px solid ${selectedColor===c.id ? "#4f46e5" : "white"}`, boxShadow: selectedColor===c.id ? "0 0 0 1px #4f46e5, 0 2px 6px rgba(79,70,229,0.3)" : "0 0 0 1px rgba(0,0,0,0.1)", cursor:"pointer", background:c.hex, flexShrink:0, transform: selectedColor===c.id ? "scale(1.15)" : "scale(1)", transition:"all 120ms" }}
                                title={`DMC ${findClosestDMC(c.hex).number}`} />
                            ))}
                            {selectedColor !== null && (
                              <>
                                <span style={{ color:"#e5e5e3" }}>|</span>
                                <span style={{ fontSize:11, color:"#6b6b68" }}>{(() => { const d = findClosestDMC(pattern.palette.find(c=>c.id===selectedColor)?.hex||"#000"); return `DMC ${d.number} · ${d.name}`; })()}</span>
                                <button onClick={() => deleteSelectedColor(selectedColor)} className="btn btn-danger-ghost btn-sm">
                                  <Icon name="trash2" size={11} />
                                  Delete all
                                </button>
                                <button onClick={() => setSelectedColor(null)} className="btn btn-ghost btn-icon btn-sm">
                                  <Icon name="x" size={11} />
                                </button>
                              </>
                            )}
                          </>
                        )}
                      </div>
                      {/* Canvas wrapper — matches belt background so deleted stitches reveal it */}
                      <div style={{ padding:"20px", background: canvasBg, overflow:"auto", transition:"background 200ms" }}>
                        <PatternCanvas
                          grid={pattern.grid} width={pattern.width} height={pattern.height}
                          palette={pattern.palette} selectedColor={selectedColor} onCellPaint={paintCell}
                          zoom={patternZoom} onPaintEnd={() => { isPaintingRef.current = false; }}
                          onColorPick={selectColorHandler} canvasBg={canvasBg}
                          stitchSelectMode={stitchSelectMode} selectedCells={selectedCells} onCellSelect={selectCell}
                          cropMode={cropMode} cropBounds={cropBounds} onCropBoundsChange={setCropBounds}
                        />
                      </div>
                    </>
                  )}
                </div>

                {/* ── Palette ── */}
                <div className="panel">
                  <div style={{ padding:"12px 14px 8px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:"1px solid #f0f0ee" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <Icon name="palette" size={14} className="text-neutral-400" strokeWidth={1.5} />
                      <span style={{ fontSize:12, fontWeight:600, color:"#1a1a18" }}>Color Palette</span>
                      <span style={{ fontSize:11, color:"#a0a09d", background:"#f4f4f3", padding:"1px 6px", borderRadius:10 }}>{pattern.palette.length}</span>
                    </div>
                    <span style={{ fontSize:11, color:"#c0c0bc" }}>Click swatch to select · ⋯ to edit</span>
                  </div>
                  <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr" }}>
                    {pattern.palette
                      .slice().sort((a,b) => (colorCounts[b.id]||0) - (colorCounts[a.id]||0))
                      .map(color => (
                        <ColorSwatch key={color.id} color={color}
                          count={colorCounts[color.id]||0} total={totalStitches}
                          isSelected={selectedColor === color.id}
                          onSelect={setSelectedColor} onMerge={mergeColor}
                          onDelete={deleteColor} onDeleteTransparent={deleteColorTransparent} onSwap={swapColor} palette={pattern.palette}
                        />
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      )}

      {/* ── LIBRARY ── */}
      {tab === "library" && (
        <div style={{ maxWidth:1280, margin:"0 auto", padding:"24px" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:20 }}>
            <div>
              <h2 style={{ fontSize:18, fontWeight:700, color:"#1a1a18", margin:0 }}>Library</h2>
              <p style={{ fontSize:13, color:"#a0a09d", margin:"3px 0 0" }}>{library.length === 0 ? "No saved patterns yet" : `${library.length} pattern${library.length !== 1 ? "s" : ""}`}</p>
            </div>
            <button onClick={() => setTab("create")} className="btn btn-primary">
              <Icon name="plus" size={14} />
              New Pattern
            </button>
          </div>

          {library.length === 0 ? (
            <div className="panel" style={{ padding:64, textAlign:"center" }}>
              <div style={{ width:48, height:48, borderRadius:12, background:"#f4f4f3", display:"flex", alignItems:"center", justifyContent:"center", margin:"0 auto 12px" }}>
                <Icon name="folder" size={22} strokeWidth={1.5} className="text-neutral-400" />
              </div>
              <div style={{ fontSize:14, fontWeight:600, color:"#1a1a18", marginBottom:6 }}>No saved patterns yet</div>
              <div style={{ fontSize:13, color:"#a0a09d" }}>Generate a pattern, then name and save it from the Create tab.</div>
            </div>
          ) : (
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(160px, 1fr))", gap:12 }}>
              {library.map(entry => (
                <div key={entry.id} className="panel" style={{ overflow:"hidden", cursor:"default", transition:"box-shadow 120ms" }}
                  onMouseEnter={e => e.currentTarget.style.boxShadow="0 4px 16px rgba(0,0,0,0.08)"}
                  onMouseLeave={e => e.currentTarget.style.boxShadow=""}>
                  <div style={{ background:"#f8f8f7", display:"flex", alignItems:"center", justifyContent:"center", padding:16, borderBottom:"1px solid #f0f0ee", minHeight:100 }}>
                    <img src={entry.thumb} alt={entry.name} style={{ imageRendering:"pixelated", maxWidth:"100%", maxHeight:80 }} />
                  </div>
                  <div style={{ padding:"10px 12px" }}>
                    <div style={{ fontSize:13, fontWeight:600, color:"#1a1a18", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{entry.name}</div>
                    <div style={{ fontSize:11, color:"#a0a09d", marginTop:2 }}>{entry.pattern.width}×{entry.pattern.height} · {entry.pattern.palette.length} colors</div>
                    <div style={{ fontSize:10, color:"#c0c0bc", marginTop:2 }}>{entry.date}</div>
                    <div style={{ display:"flex", gap:6, marginTop:10 }}>
                      <button onClick={() => loadFromLibrary(entry)} className="btn btn-secondary btn-sm" style={{ flex:1, justifyContent:"center" }}>Edit</button>
                      <button onClick={() => { setBeltSlots(s => [...s, { id: Date.now(), pattern: entry.pattern, thumb: entry.thumb, name: entry.name }]); setTab("belt"); }}
                        className="btn btn-secondary btn-sm" style={{ flex:1, justifyContent:"center" }}>+ Belt</button>
                      <button onClick={() => setLibrary(l => l.filter(e => e.id !== entry.id))}
                        className="btn btn-ghost btn-icon btn-sm" style={{ color:"#ef4444" }}>
                        <Icon name="trash2" size={12} />
                      </button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* ── BELT DESIGNER ── */}
      {tab === "belt" && (
        <div ref={beltDesignerRef} style={{ maxWidth:1280, margin:"0 auto", padding:"24px", display:"flex", flexDirection:"column", gap:16 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div>
              <h2 style={{ fontSize:18, fontWeight:700, color:"#1a1a18", margin:0 }}>Belt Designer</h2>
              <p style={{ fontSize:13, color:"#a0a09d", margin:"3px 0 0" }}>Arrange saved icons into a full belt layout</p>
            </div>
            <button onClick={() => setTab("library")} className="btn btn-primary">
              <Icon name="plus" size={14} />
              Add from Library
            </button>
          </div>

          {/* Belt Controls */}
          <div className="panel" style={{ padding:"16px", display:"flex", flexWrap:"wrap", gap:20, alignItems:"flex-end" }}>
            <div>
              <div style={{ fontSize:11, fontWeight:500, color:"#6b6b68", marginBottom:6 }}>Background</div>
              <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                <input type="color" value={beltBg} onChange={e => setBeltBg(e.target.value)}
                  style={{ width:32, height:28, borderRadius:6, border:"1px solid #e5e5e3", cursor:"pointer", padding:2 }} />
                <span style={{ fontSize:11, fontFamily:"monospace", color:"#6b6b68" }}>{beltBg.toUpperCase()}</span>
              </div>
            </div>
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ fontSize:11, fontWeight:500, color:"#6b6b68" }}>Icon Spacing</span>
                <span style={{ fontSize:11, fontFamily:"monospace", color:"#4f46e5", marginLeft:12 }}>{beltSpacing}px</span>
              </div>
              <input type="range" min={0} max={20} value={beltSpacing} onChange={e => setBeltSpacing(+e.target.value)} style={{ width:120 }} />
            </div>
            <div>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ fontSize:11, fontWeight:500, color:"#6b6b68" }}>Belt Length</span>
                <span style={{ fontSize:11, fontFamily:"monospace", color:"#4f46e5", marginLeft:12 }}>{beltLength}</span>
              </div>
              <input type="range" min={100} max={750} step={6} value={beltLength} onChange={e => setBeltLength(+e.target.value)} style={{ width:160 }} />
            </div>
            <div style={{ flex:1 }} />
            <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
              {editingBeltId && (
                <span style={{ fontSize:11, color:"#4f46e5", fontWeight:500, alignSelf:"center" }}>Editing saved belt</span>
              )}
              <input type="text" placeholder="Belt name…" value={beltName} onChange={e => setBeltName(e.target.value)}
                onKeyDown={e => {
                  if (e.key !== "Enter" || !beltName.trim() || beltSlots.length === 0) return;
                  if (editingBeltId) {
                    setSavedBelts(b => b.map(bb => bb.id === editingBeltId ? { ...bb, name: beltName.trim(), slots: JSON.parse(JSON.stringify(beltSlots)), bg: beltBg, spacing: beltSpacing, length: beltLength, date: new Date().toLocaleDateString() } : bb));
                    setEditingBeltId(null);
                  } else {
                    setSavedBelts(b => [{ id: Date.now(), name: beltName.trim(), slots: JSON.parse(JSON.stringify(beltSlots)), bg: beltBg, spacing: beltSpacing, length: beltLength, date: new Date().toLocaleDateString() }, ...b]);
                  }
                  setBeltName("");
                }}
                style={{ border:`1px solid ${editingBeltId ? "#4f46e5" : "#e5e5e3"}`, borderRadius:7, padding:"7px 10px", fontSize:13, outline:"none", color:"#1a1a18", width:160 }}
                onFocus={e => e.target.style.borderColor="#4f46e5"}
                onBlur={e => e.target.style.borderColor= editingBeltId ? "#4f46e5" : "#e5e5e3"} />
              {editingBeltId && (
                <button onClick={() => { setEditingBeltId(null); setBeltName(""); }} className="btn btn-secondary btn-sm">
                  <Icon name="x" size={13} />
                  Cancel
                </button>
              )}
              <button disabled={!beltName.trim() || beltSlots.length === 0}
                onClick={() => {
                  if (!beltName.trim() || beltSlots.length === 0) return;
                  if (editingBeltId) {
                    setSavedBelts(b => b.map(bb => bb.id === editingBeltId ? { ...bb, name: beltName.trim(), slots: JSON.parse(JSON.stringify(beltSlots)), bg: beltBg, spacing: beltSpacing, length: beltLength, date: new Date().toLocaleDateString() } : bb));
                    setEditingBeltId(null);
                  } else {
                    setSavedBelts(b => [{ id: Date.now(), name: beltName.trim(), slots: JSON.parse(JSON.stringify(beltSlots)), bg: beltBg, spacing: beltSpacing, length: beltLength, date: new Date().toLocaleDateString() }, ...b]);
                  }
                  setBeltName("");
                }}
                className="btn btn-primary">
                <Icon name="save" size={13} />
                {editingBeltId ? "Update Belt" : "Save Belt"}
              </button>
            </div>
          </div>

          {/* Icon Slots */}
          <div className="panel" style={{ padding:"16px" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
              <div className="section-label" style={{ marginBottom:0 }}>Icon Slots — drag to reorder</div>
              {beltSlots.length > 0 && <button onClick={() => setBeltSlots([])} className="btn btn-danger-ghost btn-sm">Clear all</button>}
            </div>
            {beltSlots.length === 0 ? (
              <div style={{ border:"2px dashed #e5e5e3", borderRadius:10, height:96, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:6 }}>
                <Icon name="package" size={18} strokeWidth={1.5} className="text-neutral-400" />
                <div style={{ fontSize:13, color:"#a0a09d" }}>Go to <strong>Library</strong> and click <strong>+ Belt</strong> on any pattern</div>
              </div>
            ) : (
              <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
                {beltSlots.map((slot, idx) => (
                  <div key={slot.id} draggable
                    onDragStart={e => { e.dataTransfer.setData("slotIdx", String(idx)); e.dataTransfer.effectAllowed = "move"; }}
                    onDragOver={e => { e.preventDefault(); setDragOverSlot(idx); }}
                    onDragLeave={() => setDragOverSlot(null)}
                    onDrop={e => { e.preventDefault(); const from = parseInt(e.dataTransfer.getData("slotIdx")); if (isNaN(from) || from === idx) { setDragOverSlot(null); return; } setBeltSlots(s => { const next = [...s]; const [moved] = next.splice(from, 1); next.splice(idx, 0, moved); return next; }); setDragOverSlot(null); }}
                    style={{ position:"relative", display:"flex", flexDirection:"column", alignItems:"center", gap:4, padding:8, borderRadius:10, border:`1.5px solid ${dragOverSlot===idx ? "#4f46e5" : "#e5e5e3"}`, cursor:"grab", userSelect:"none", background: dragOverSlot===idx ? "#f8f7ff" : "white", minWidth:70, transition:"all 120ms" }}>
                    <span style={{ fontSize:10, color:"#c0c0bc", position:"absolute", top:4, left:6 }}>#{idx+1}</span>
                    <img src={slot.thumb} alt={slot.name} style={{ imageRendering:"pixelated", width:48, height:48, objectFit:"contain" }} />
                    <div style={{ fontSize:11, color:"#6b6b68", maxWidth:64, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", textAlign:"center" }}>{slot.name}</div>
                    <button onClick={() => setBeltSlots(s => s.filter((_,i) => i !== idx))}
                      style={{ position:"absolute", top:-6, right:-6, width:18, height:18, borderRadius:"50%", background:"#fee2e2", color:"#ef4444", border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontSize:10 }}>
                      <Icon name="x" size={9} />
                    </button>
                  </div>
                ))}
                <div onDragOver={e => { e.preventDefault(); setDragOverSlot(beltSlots.length); }} onDragLeave={() => setDragOverSlot(null)}
                  onDrop={e => { e.preventDefault(); const from = parseInt(e.dataTransfer.getData("slotIdx")); if (!isNaN(from)) { setBeltSlots(s => { const next = [...s]; const [m] = next.splice(from, 1); next.push(m); return next; }); } setDragOverSlot(null); }}
                  style={{ width:70, height:88, borderRadius:10, border:`2px dashed ${dragOverSlot===beltSlots.length ? "#4f46e5" : "#e5e5e3"}`, display:"flex", alignItems:"center", justifyContent:"center", color: dragOverSlot===beltSlots.length ? "#4f46e5" : "#c0c0bc", transition:"all 120ms", fontSize:20 }}>
                  +
                </div>
              </div>
            )}
          </div>

          {/* Live belt preview */}
          <div className="panel" style={{ padding:"16px" }}>
            <div className="section-label">Belt Preview</div>
            <BeltPreview slots={beltSlots} bg={beltBg} spacing={beltSpacing} beltLength={beltLength} />
          </div>

          {/* Saved belts */}
          {savedBelts.length > 0 && (
            <div className="panel" style={{ padding:"16px" }}>
              <div className="section-label">Saved Belts</div>
              <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                {savedBelts.map(belt => {
                  const isEditing = editingBeltId === belt.id;
                  return (
                    <div key={belt.id} style={{ border:`1.5px solid ${isEditing ? "#4f46e5" : "#e5e5e3"}`, borderRadius:10, padding:12, background: isEditing ? "#f8f7ff" : "white", transition:"border-color 120ms" }}
                      onMouseEnter={e => { if (!isEditing) e.currentTarget.style.borderColor="#d4d4d2"; }}
                      onMouseLeave={e => { if (!isEditing) e.currentTarget.style.borderColor="#e5e5e3"; }}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                        <div>
                          <div style={{ fontSize:13, fontWeight:600, color: isEditing ? "#4f46e5" : "#1a1a18" }}>
                            {belt.name}
                            {isEditing && <span style={{ fontSize:11, fontWeight:400, marginLeft:8, color:"#4f46e5" }}>— editing</span>}
                          </div>
                          <div style={{ fontSize:11, color:"#a0a09d", marginTop:2 }}>{belt.slots.length} icons · {belt.length} stitches · {belt.date}</div>
                        </div>
                        <div style={{ display:"flex", gap:8 }}>
                          <button onClick={() => {
                            setBeltSlots(JSON.parse(JSON.stringify(belt.slots)));
                            setBeltBg(belt.bg);
                            setBeltSpacing(belt.spacing);
                            setBeltLength(belt.length);
                            setBeltName(belt.name);
                            setEditingBeltId(belt.id);
                            beltDesignerRef.current?.scrollIntoView({ behavior:"smooth", block:"start" });
                          }} className={`btn btn-sm ${isEditing ? "btn-primary" : "btn-secondary"}`}>
                            <Icon name="settings2" size={12} />
                            Edit
                          </button>
                          <button onClick={() => { setSavedBelts(b => b.filter(bb => bb.id !== belt.id)); if (isEditing) { setEditingBeltId(null); setBeltName(""); } }}
                            className="btn btn-ghost btn-icon btn-sm" style={{ color:"#ef4444" }}>
                            <Icon name="trash2" size={12} />
                          </button>
                        </div>
                      </div>
                      <BeltPreview slots={belt.slots} bg={belt.bg} spacing={belt.spacing} beltLength={belt.length} compact />
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NeedlepointApp />);
  </script>
</body>
</html>
