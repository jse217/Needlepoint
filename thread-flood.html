<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thread Flood">
<title>Thread Flood</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@600;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; height: 100%; }
body { margin: 0; }
/* Layout: one-screen app. Header and status on top, a canvas on wooden stretcher bars fills the middle, thread skeins sit at the thumb. */
:root {
  --bg: #E6E9E3;
  --surface: #F7F8F4;
  --ink: #1E2320;
  --muted: #5B635D;
  --line: #C8CDC5;
  --accent: #2C5A86;
  --wood: #BC8C57;
  --wood-dark: #80582F;
  --mesh: #ECE4CF;
  --scrim: rgba(30, 35, 32, 0.38);
  --display: "Grandstander", ui-rounded, "Avenir Next", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --body: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131619; --surface: #1D2125; --ink: #E8EBE5; --muted: #9AA29B; --line: #31373C;
    --accent: #8FB7E2; --wood: #8F683E; --wood-dark: #5B4023; --scrim: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131619; --surface: #1D2125; --ink: #E8EBE5; --muted: #9AA29B; --line: #31373C;
  --accent: #8FB7E2; --wood: #8F683E; --wood-dark: #5B4023; --scrim: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
.app {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 560px;
  margin: 0 auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 800;
  font-size: 1.75rem;
  line-height: 1;
  letter-spacing: -0.01em;
}
h1 span { color: var(--accent); }

.controls { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg {
  display: inline-flex;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}
.seg button, .icon-btn, .act {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}
.seg button {
  font-size: 0.82rem;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 999px;
  color: var(--muted);
  min-height: 34px;
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg .mono { font-family: var(--mono); font-weight: 500; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.8rem; font-weight: 600; color: var(--muted);
  padding: 8px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  min-height: 36px;
}
.icon-btn[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

.status {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 0.8rem;
  color: var(--muted);
}
.status b { color: var(--ink); font-weight: 600; font-size: 1.15rem; }
.status .left { display: flex; align-items: baseline; gap: 6px; }
.status .low b { color: #C0392B; }

.board { flex: 1; min-height: 0; display: grid; place-items: center; }
.frame {
  position: relative;
  padding: 12px;
  border-radius: 6px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.07) 0 3px, rgba(0,0,0,0.05) 3px 7px),
    linear-gradient(180deg, var(--wood), var(--wood-dark));
  box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 10px 24px -12px rgba(0,0,0,0.5);
}
/* brass tacks at the stretcher-bar joints */
.frame::before {
  content: ""; position: absolute; top: 4px; width: 5px; height: 5px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #F3DB9A, #9C7A2E);
  left: 4px; box-shadow: calc(var(--fw, 300px) - 13px) 0 0 0 #B8953F, 0 calc(var(--fw, 300px) - 13px) 0 0 #B8953F, calc(var(--fw, 300px) - 13px) calc(var(--fw, 300px) - 13px) 0 0 #B8953F;
}
canvas { display: block; border-radius: 2px; background: var(--mesh); touch-action: none; }

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  background: var(--scrim);
  border-radius: 6px;
  padding: 16px;
}
.card {
  background: var(--surface);
  color: var(--ink);
  border-radius: 14px;
  padding: 20px 18px 16px;
  width: min(300px, 100%);
  box-sizing: border-box;
  text-align: center;
  display: grid; gap: 10px;
  box-shadow: 0 18px 40px -16px rgba(0,0,0,0.55);
}
.card h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 1.45rem; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }
.card .stars { display: flex; justify-content: center; gap: 10px; height: 30px; }
.card .stars svg { width: 30px; height: 30px; }
.card .stats { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.card .row { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }

.act {
  font-weight: 700; font-size: 0.9rem;
  padding: 11px 16px; border-radius: 12px; min-height: 44px;
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  flex: 1;
}
.act.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.skeins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.skein {
  position: relative;
  height: 64px;
  border-radius: 12px;
  border: 0;
  padding: 0;
  cursor: pointer;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.18) 0 2px, rgba(0,0,0,0.10) 2px 5px),
    var(--c);
  box-shadow: 0 2px 0 rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.08) inset;
  transition: transform 120ms ease, opacity 160ms ease;
  overflow: hidden;
}
.skein:active { transform: translateY(2px) scale(0.97); }
/* the paper band around a real DMC skein, carrying its colour number */
.skein .band {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  background: #FBFAF4; color: #1E2320;
  font-family: var(--mono); font-weight: 600; font-size: 0.72rem;
  padding: 3px 0; letter-spacing: 0.02em;
  border-block: 1px solid rgba(0,0,0,0.15);
}
.skein .key { position: absolute; top: 4px; right: 6px; font-family: var(--mono); font-size: 0.6rem; color: rgba(255,255,255,0.85); text-shadow: 0 1px 1px rgba(0,0,0,0.4); }
.skein[disabled] { opacity: 0.32; cursor: default; transform: none; }

.actions { display: flex; gap: 8px; }
.hint { margin: 0; font-size: 0.78rem; color: var(--muted); text-align: center; line-height: 1.35; }

button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .skein { transition: none; } }
@media (max-height: 640px) { .skein { height: 52px; } h1 { font-size: 1.45rem; } .hint { display: none; } }
</style>

</head>
<body>
<main class="app" id="app">
  <header>
    <h1>Thread <span>Flood</span></h1>
    <button class="icon-btn" id="symToggle" aria-pressed="false" title="Show chart symbols on each stitch">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="4.5" cy="4.5" r="2.5"/><path d="M11.5 2l2.6 5H8.9z"/><rect x="2" y="9.5" width="5" height="5"/><path d="M9 10l5 5M14 10l-5 5"/></svg>
      Symbols
    </button>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Game mode">
      <button id="modeDaily" aria-pressed="true">Daily canvas</button>
      <button id="modePractice" aria-pressed="false">Practice</button>
    </div>
    <div class="seg" role="group" aria-label="Canvas size">
      <button class="mono" data-size="10" aria-pressed="false">10</button>
      <button class="mono" data-size="14" aria-pressed="true">14</button>
      <button class="mono" data-size="18" aria-pressed="false">18</button>
    </div>
  </div>

  <div class="status" aria-live="polite">
    <div class="left" id="movesWrap">Moves <b id="moves">0</b>/<span id="limit">0</span></div>
    <div>par <span id="par">0</span></div>
    <div><span id="cover">0</span>% stitched</div>
  </div>

  <div class="board" id="board">
    <div class="frame" id="frame">
      <canvas id="cv" aria-label="Needlepoint canvas"></canvas>
      <div class="overlay" id="overlay" hidden>
        <div class="card">
          <div class="stars" id="stars"></div>
          <h2 id="ovTitle">Canvas finished</h2>
          <p id="ovText"></p>
          <div class="stats" id="ovStats"></div>
          <div class="row">
            <button class="act" id="ovShare">Copy result</button>
            <button class="act primary" id="ovNext">New canvas</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="skeins" id="skeins" role="group" aria-label="Thread colours"></div>
  <div class="actions">
    <button class="act" id="restart">Unpick all</button>
    <button class="act primary" id="newGame">New canvas</button>
  </div>
  <p class="hint">Your needle starts at the top-left stitch. Pick a thread to recolour your patch and pull in every touching stitch of that colour. Cover the whole canvas before you run out of moves.</p>
</main>

<script>
(() => {
  const THREADS = [
    { dmc: "321", name: "Red",            hex: "#C72B3B" },
    { dmc: "740", name: "Tangerine",      hex: "#F7801A" },
    { dmc: "444", name: "Lemon",          hex: "#F5CE1B" },
    { dmc: "702", name: "Kelly Green",    hex: "#47A72F" },
    { dmc: "797", name: "Royal Blue",     hex: "#1F4F8C" },
    { dmc: "550", name: "Violet",         hex: "#5C1F56" },
  ];
  const K = THREADS.length;

  // ---------- colour helpers ----------
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mix = (rgb, t, to) => rgb.map((v, i) => Math.round(v + (to[i] - v) * t));
  const css = rgb => `rgb(${rgb[0]},${rgb[1]},${rgb[2]})`;
  THREADS.forEach(t => {
    const rgb = hexRgb(t.hex);
    t.shade = css(mix(rgb, 0.32, [0, 0, 0]));
    t.hi = css(mix(rgb, 0.38, [255, 255, 255]));
    const lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
    t.symInk = lum > 0.55 ? "rgba(20,20,20,0.72)" : "rgba(255,255,255,0.88)";
  });

  // ---------- seeded random ----------
  function hashStr(s) {
    let h = 1779033703 ^ s.length;
    for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    return (h >>> 0);
  }
  function mulberry32(a) {
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function todayKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // ---------- flood logic ----------
  function regionOf(g, n) {
    const c0 = g[0], seen = new Uint8Array(n * n), q = [0];
    seen[0] = 1;
    for (let i = 0; i < q.length; i++) {
      const p = q[i], x = p % n;
      const nb = [x > 0 ? p - 1 : -1, x < n - 1 ? p + 1 : -1, p - n, p + n];
      for (const np of nb) {
        if (np < 0 || np >= n * n || seen[np] || g[np] !== c0) continue;
        seen[np] = 1; q.push(np);
      }
    }
    return q; // BFS order from the corner, so index order doubles as distance order
  }
  function applyColor(g, n, c) {
    const out = g.slice();
    for (const p of regionOf(g, n)) out[p] = c;
    return out;
  }
  // Greedy solver with two-move lookahead: sets par for each canvas.
  function solve(grid, n) {
    const N = n * n;
    let g = grid.slice(), moves = 0;
    while (regionOf(g, n).length < N && moves < 300) {
      let best = -1, bestScore = -1;
      for (let c = 0; c < K; c++) {
        if (c === g[0]) continue;
        const g1 = applyColor(g, n, c);
        const s1 = regionOf(g1, n).length;
        let s = s1;
        if (s1 >= N) s = N * 10;
        else for (let c2 = 0; c2 < K; c2++) {
          if (c2 === c) continue;
          s = Math.max(s, regionOf(applyColor(g1, n, c2), n).length);
        }
        const score = s * 10000 + s1;
        if (score > bestScore) { bestScore = score; best = c; }
      }
      g = applyColor(g, n, best);
      moves++;
    }
    return moves;
  }

  // ---------- persistence ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  let stats = store.get("tf_stats", { played: 0, won: 0, streak: 0, bestStreak: 0 });

  // ---------- state ----------
  let S = null;
  const prefs = store.get("tf_prefs", { symbols: false });

  function newGame(mode, size) {
    const seed = mode === "daily" ? `daily-${todayKey()}-${size}` : `practice-${Date.now()}-${Math.random()}`;
    const rng = mulberry32(hashStr(seed));
    const grid = Array.from({ length: size * size }, () => Math.floor(rng() * K));
    const par = solve(grid, size);
    S = { mode, size, seed, day: todayKey(), start: grid.slice(), grid, moves: 0, par, limit: par + 3, done: null, path: [] };
    resetAnim();
    save();
    syncUI();
    layout();
  }
  function save() { store.set("tf_game", S); }

  // ---------- canvas + animation ----------
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let cssSize = 300, dpr = 1;
  let animFrom, animStart, flashStart, raf = 0;

  function resetAnim() {
    const N = S.size * S.size;
    animFrom = new Int8Array(N).fill(-1);
    animStart = new Float64Array(N);
    flashStart = new Float64Array(N).fill(-1);
  }

  function layout() {
    const board = document.getElementById("board");
    const frame = document.getElementById("frame");
    const pad = 24;
    const avail = Math.max(160, Math.floor(Math.min(board.clientWidth, board.clientHeight) - pad));
    const n = S ? S.size : 14;
    cssSize = Math.floor(avail / n) * n; // whole pixels per stitch keeps the mesh crisp
    dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.style.width = cv.style.height = cssSize + "px";
    cv.width = cv.height = Math.round(cssSize * dpr);
    frame.style.setProperty("--fw", (cssSize + pad) + "px");
    draw(performance.now());
  }

  function drawStitch(x, y, cs, ci, p) {
    const t = THREADS[ci];
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, cs, cs); ctx.clip();
    ctx.globalAlpha = p < 1 ? Math.min(1, p * 1.4) : 1;
    ctx.fillStyle = t.shade;
    ctx.fillRect(x, y, cs, cs);
    ctx.globalAlpha = 1;
    // a tent stitch: one diagonal over a single canvas intersection, lower-left to upper-right
    const a = cs * 0.1, x0 = x + a, y0 = y + cs - a, x1 = x + cs - a, y1 = y + a;
    const ex = x0 + (x1 - x0) * p, ey = y0 + (y1 - y0) * p;
    ctx.lineCap = "round";
    ctx.strokeStyle = t.hex;
    ctx.lineWidth = cs * 0.74;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = t.hi;
    ctx.lineWidth = cs * 0.14;
    const o = cs * 0.12;
    ctx.beginPath(); ctx.moveTo(x0 - o * 0.4, y0 - o); ctx.lineTo(ex - o * 0.4, ey - o); ctx.stroke();
    ctx.restore();
  }

  function drawSymbol(x, y, cs, ci) {
    const cx = x + cs / 2, cy = y + cs / 2, r = cs * 0.2;
    ctx.save();
    ctx.fillStyle = ctx.strokeStyle = THREADS[ci].symInk;
    ctx.lineWidth = Math.max(1.2, cs * 0.08);
    ctx.beginPath();
    switch (ci) {
      case 0: ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); break;
      case 1: ctx.moveTo(cx, cy - r * 1.1); ctx.lineTo(cx + r * 1.1, cy + r * 0.9); ctx.lineTo(cx - r * 1.1, cy + r * 0.9); ctx.closePath(); ctx.fill(); break;
      case 2: ctx.rect(cx - r * 0.9, cy - r * 0.9, r * 1.8, r * 1.8); ctx.fill(); break;
      case 3: ctx.moveTo(cx, cy - r * 1.2); ctx.lineTo(cx + r * 1.2, cy); ctx.lineTo(cx, cy + r * 1.2); ctx.lineTo(cx - r * 1.2, cy); ctx.closePath(); ctx.fill(); break;
      case 4: ctx.moveTo(cx - r, cy); ctx.lineTo(cx + r, cy); ctx.moveTo(cx, cy - r); ctx.lineTo(cx, cy + r); ctx.stroke(); break;
      default: ctx.moveTo(cx - r, cy - r); ctx.lineTo(cx + r, cy + r); ctx.moveTo(cx + r, cy - r); ctx.lineTo(cx - r, cy + r); ctx.stroke();
    }
    ctx.restore();
  }

  function draw(now) {
    if (!S) return;
    const n = S.size, cs = cssSize / n, N = n * n;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cssSize, cssSize);
    let busy = false;
    const STITCH_MS = 170, FLASH_MS = 380;
    for (let i = 0; i < N; i++) {
      const x = (i % n) * cs, y = Math.floor(i / n) * cs;
      const ci = S.grid[i];
      if (animFrom[i] >= 0) {
        const p = (now - animStart[i]) / STITCH_MS;
        if (p < 1) {
          busy = true;
          drawStitch(x, y, cs, animFrom[i], 1);
          if (p > 0) drawStitch(x, y, cs, ci, p);
        } else { animFrom[i] = -1; drawStitch(x, y, cs, ci, 1); }
      } else drawStitch(x, y, cs, ci, 1);
      if (prefs.symbols) drawSymbol(x, y, cs, ci);
      if (flashStart[i] >= 0) {
        const f = (now - flashStart[i]) / FLASH_MS;
        if (f < 1) {
          busy = true;
          if (f > 0) { ctx.fillStyle = `rgba(255,255,255,${0.55 * (1 - f)})`; ctx.fillRect(x, y, cs, cs); }
        } else flashStart[i] = -1;
      }
    }
    // canvas mesh: the threads of the base canvas peeking between stitches
    ctx.strokeStyle = "rgba(40,30,15,0.16)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = 1; k < n; k++) {
      const v = Math.round(k * cs) + 0.5;
      ctx.moveTo(v, 0); ctx.lineTo(v, cssSize); ctx.moveTo(0, v); ctx.lineTo(cssSize, v);
    }
    ctx.stroke();
    if (!busy) drawRunningStitch(n, cs);
    if (busy) raf = requestAnimationFrame(draw); else raf = 0;
  }

  // White running stitch around the patch your needle owns
  function drawRunningStitch(n, cs) {
    const reg = regionOf(S.grid, n);
    if (reg.length === n * n) return;
    const own = new Uint8Array(n * n);
    for (const p of reg) own[p] = 1;
    ctx.save();
    ctx.lineCap = "round";
    ctx.setLineDash([cs * 0.32, cs * 0.22]);
    const path = new Path2D();
    for (const p of reg) {
      const x = (p % n) * cs, y = Math.floor(p / n) * cs, cx = p % n, cy = Math.floor(p / n);
      if (cx < n - 1 && !own[p + 1]) { path.moveTo(x + cs, y); path.lineTo(x + cs, y + cs); }
      if (cy < n - 1 && !own[p + n]) { path.moveTo(x, y + cs); path.lineTo(x + cs, y + cs); }
      if (cx > 0 && !own[p - 1]) { path.moveTo(x, y); path.lineTo(x, y + cs); }
      if (cy > 0 && !own[p - n]) { path.moveTo(x, y); path.lineTo(x + cs, y); }
    }
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = Math.max(2.5, cs * 0.16); ctx.stroke(path);
    ctx.strokeStyle = "#FFFDF5"; ctx.lineWidth = Math.max(1.5, cs * 0.09); ctx.stroke(path);
    ctx.restore();
  }

  function kick() { if (!raf) raf = requestAnimationFrame(draw); }

  // ---------- moves ----------
  let overlayTimer = 0;
  function play(c) {
    if (!S || S.done || c === S.grid[0]) return;
    const n = S.size, N = n * n;
    const oldGrid = S.grid;
    const oldRegion = regionOf(oldGrid, n);
    const ownedBefore = new Uint8Array(N);
    for (const p of oldRegion) ownedBefore[p] = 1;
    S.grid = applyColor(oldGrid, n, c);
    S.moves++;
    S.path.push(c);
    const newRegion = regionOf(S.grid, n);

    if (!reduceMotion) {
      // ripple outward from the corner: BFS order from regionOf is distance order
      const now = performance.now();
      const step = Math.min(14, 520 / Math.max(1, newRegion.length));
      newRegion.forEach((p, k) => {
        const t = now + k * step;
        if (ownedBefore[p]) { animFrom[p] = oldGrid[p]; animStart[p] = t; }
        else flashStart[p] = t + 60;
      });
    }

    if (newRegion.length === N) finish(true);
    else if (S.moves >= S.limit) finish(false);
    save();
    syncUI();
    kick();
  }

  function starsFor(moves, par) { return moves <= par ? 3 : moves <= par + 2 ? 2 : 1; }

  function finish(win) {
    S.done = { win, stars: win ? starsFor(S.moves, S.par) : 0 };
    stats.played++;
    if (win) { stats.won++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak); }
    else stats.streak = 0;
    store.set("tf_stats", stats);
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(showOverlay, reduceMotion ? 0 : 750);
  }

  const crossSvg = on => `<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7 23L23 7M7 7l16 16" stroke="${on ? "var(--accent)" : "var(--line)"}" stroke-width="5" stroke-linecap="round"/></svg>`;

  function showOverlay() {
    if (!S || !S.done) return;
    const d = S.done;
    document.getElementById("stars").innerHTML = [0, 1, 2].map(i => crossSvg(i < d.stars)).join("");
    document.getElementById("stars").setAttribute("aria-label", `${d.stars} of 3 stitches`);
    const leftCount = S.size * S.size - regionOf(S.grid, S.size).length;
    document.getElementById("ovTitle").textContent = d.win
      ? (S.moves < S.par ? "Better than the pattern" : d.stars === 3 ? "Perfect tension" : "Canvas finished")
      : "Out of thread";
    document.getElementById("ovText").textContent = d.win
      ? `You covered the ${S.size} × ${S.size} canvas in ${S.moves} moves. Par is ${S.par}.`
      : `${leftCount} stitch${leftCount === 1 ? "" : "es"} left bare after ${S.limit} moves. Unpick and try a new route.`;
    document.getElementById("ovStats").textContent = `won ${stats.won} of ${stats.played} · streak ${stats.streak} · best ${stats.bestStreak}`;
    document.getElementById("ovNext").textContent = d.win ? (S.mode === "daily" ? "Practice canvas" : "Next canvas") : "Unpick all";
    document.getElementById("overlay").hidden = false;
  }
  function hideOverlay() { clearTimeout(overlayTimer); document.getElementById("overlay").hidden = true; }

  // ---------- UI ----------
  const skeinsEl = document.getElementById("skeins");
  THREADS.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "skein";
    b.style.setProperty("--c", t.hex);
    b.setAttribute("aria-label", `DMC ${t.dmc} ${t.name}`);
    b.innerHTML = `<span class="band">${t.dmc}</span><span class="key" aria-hidden="true">${i + 1}</span>`;
    b.addEventListener("click", () => play(i));
    skeinsEl.appendChild(b);
  });

  function syncUI() {
    document.getElementById("moves").textContent = S.moves;
    document.getElementById("limit").textContent = S.limit;
    document.getElementById("par").textContent = S.par;
    const pct = Math.floor(100 * regionOf(S.grid, S.size).length / (S.size * S.size));
    document.getElementById("cover").textContent = pct;
    document.getElementById("movesWrap").classList.toggle("low", !S.done && S.limit - S.moves <= 3);
    [...skeinsEl.children].forEach((b, i) => { b.disabled = !!S.done || i === S.grid[0]; });
    document.getElementById("modeDaily").setAttribute("aria-pressed", S.mode === "daily");
    document.getElementById("modePractice").setAttribute("aria-pressed", S.mode === "practice");
    document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.size === S.size));
    document.getElementById("symToggle").setAttribute("aria-pressed", !!prefs.symbols);
    document.getElementById("newGame").textContent = S.mode === "daily" ? "Practice canvas" : "New canvas";
    if (!S.done) hideOverlay();
  }

  function restart() {
    S.grid = S.start.slice(); S.moves = 0; S.done = null; S.path = [];
    resetAnim(); save(); syncUI(); kick();
  }

  document.getElementById("modeDaily").addEventListener("click", () => { hideOverlay(); newGame("daily", S.size); });
  document.getElementById("modePractice").addEventListener("click", () => { hideOverlay(); newGame("practice", S.size); });
  document.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => {
    hideOverlay(); newGame(S.mode, +b.dataset.size);
  }));
  document.getElementById("restart").addEventListener("click", () => { hideOverlay(); restart(); });
  document.getElementById("newGame").addEventListener("click", () => { hideOverlay(); newGame("practice", S.size); });
  document.getElementById("ovNext").addEventListener("click", () => {
    if (S.done && !S.done.win) { hideOverlay(); restart(); }
    else { hideOverlay(); newGame("practice", S.size); }
  });
  document.getElementById("symToggle").addEventListener("click", () => {
    prefs.symbols = !prefs.symbols; store.set("tf_prefs", prefs); syncUI(); kick();
  });
  document.getElementById("ovShare").addEventListener("click", async e => {
    const btn = e.currentTarget;
    const glyph = { 0: "🟥", 1: "🟧", 2: "🟨", 3: "🟩", 4: "🟦", 5: "🟪" };
    const label = S.mode === "daily" ? `Daily ${S.day}` : "Practice";
    const text = `Thread Flood · ${label} · ${S.size}×${S.size}\n${S.done.win ? `${S.moves}/${S.limit} moves (par ${S.par})` : "Out of thread"} ${"✕".repeat(S.done.stars)}\n${S.path.map(c => glyph[c]).join("")}`;
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; }
    catch (err) { btn.textContent = "Copy blocked"; }
    setTimeout(() => { btn.textContent = "Copy result"; }, 1600);
  });
  window.addEventListener("keydown", e => {
    const k = parseInt(e.key, 10);
    if (k >= 1 && k <= K) play(k - 1);
  });

  if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(document.getElementById("board"));
  window.addEventListener("resize", layout);

  // ---------- boot ----------
  function valid(g) { return g && Array.isArray(g.grid) && g.grid.length === g.size * g.size && Array.isArray(g.start); }
  function boot(data) {
    const hot = data && data.state;
    const saved = store.get("tf_game", null);
    const cand = valid(hot) ? hot : valid(saved) ? saved : null;
    if (cand && !(cand.mode === "daily" && cand.day !== todayKey())) {
      S = cand; S.path = S.path || [];
      resetAnim(); syncUI(); layout();
      if (S.done) showOverlay();
    } else newGame("daily", cand ? cand.size : 14);
  }
  window.claude?.hot?.snapshot?.(() => ({ state: S }));
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
